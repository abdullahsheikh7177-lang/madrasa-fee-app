<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>নোটিশ (মেসেজ বক্স)</title>
  <style>
    /* মেসেজ বক্সের স্টাইল */
    #messageBox {
      border: 2px solid #999;
      padding: 12px;
      min-height: 150px;
      width: 90%;
      border-radius: 8px;
      background: #fff;
      font-size: 18px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    /* প্লেসহোল্ডার হিসেবে দেখাবে */
    #messageBox:empty:before {
      content: "এখানে নোটিশ লিখুন (Enter দিয়ে নতুন লাইন)";
      color: #aaa;
    }
    button {
      padding: 10px 20px;
      font-size: 18px;
      margin: 5px;
      border-radius: 8px;
      border: none;
      background: #007bff;
      color: white;
      cursor: pointer;
    }
    #addLineBtn {
      background: #28a745;
    }
    .notice-item {
      border: 1px solid #999;
      padding: 10px;
      margin: 10px;
      border-radius: 8px;
      background: #f9f9f9;
    }
  </style>
</head>
<body>

<h2>📢 নতুন নোটিশ</h2>

<!-- এটাই মেসেজ বক্স (textarea-এর বিকল্প) -->
<div id="messageBox" contenteditable="true"></div>

<br>

<button id="submitNotice">✅ Submit</button>

<hr>

<div id="noticeList"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {
  initializeFirestore,
  persistentLocalCache,
  persistentSingleTabManager,
  collection,
  addDoc,
  getDocs,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDhdamD0ApIaUeW0km2uSA7ksmGJO8f5Po",
  authDomain: "madrasa-fee-app.firebaseapp.com",
  projectId: "madrasa-fee-app",
  storageBucket: "madrasa-fee-app.firebasestorage.app",
  messagingSenderId: "1011327270340",
  appId: "1:1011327270340:web:b51a08befa3aafce4a7891",
  measurementId: "G-ZT4457XDKS"
};

const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app, {
  localCache: persistentLocalCache({
    tabManager: persistentSingleTabManager()
  })
});

let notices = [];

// নোটিশ লোড
async function loadNotice() {
  const cache = localStorage.getItem("notice3");
  if (cache) {
    notices = JSON.parse(cache);
    showNotice();
  }
  if (navigator.onLine) {
    const q = query(collection(db, "notice"), orderBy("createdAt", "desc"));
    const snapshot = await getDocs(q);
    notices = [];
    snapshot.forEach((doc) => {
      notices.push({ id: doc.id, ...doc.data() });
    });
    localStorage.setItem("notice3", JSON.stringify(notices));
    showNotice();
  }
}

// নোটিশ দেখানো
function showNotice() {
  let html = "";
  notices.forEach(function(item) {
    let text = item.text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    let lines = text.split('\n');
    let formattedText = lines.join('<br>');
    html += `
<div class="notice-item">
📢 ${formattedText}
</div>
`;
  });
  document.getElementById("noticeList").innerHTML = html;
}

loadNotice();

// Submit


console.log(JSON.stringify(text));
alert(JSON.stringify(text));


  
document.getElementById("submitNotice").onclick = async function() {
  // মেসেজ বক্স থেকে টেক্সট নেওয়া (innerText নতুন লাইনগুলোকে \n-এ রাখে)
  let box = document.getElementById("messageBox");
  let text = box.innerText.trim();

  // ডিবাগ করার জন্য
  console.log(text);
  console.log(JSON.stringify(text));
  alert("✅ টেক্সট:\n" + JSON.stringify(text));

  if (text === "") {
    alert("দয়া করে কিছু লিখুন");
    return;
  }

  const newNotice = {
    id: "local_" + Date.now(),
    text: text,
    createdAt: Date.now()
  };

  notices.unshift(newNotice);
  localStorage.setItem("notice3", JSON.stringify(notices));
  showNotice();

  try {
    await addDoc(collection(db, "notice"), {
      text: text,
      createdAt: Date.now()
    });
    await loadNotice();
  } catch(e) {
    console.log("Offline Mode");
  }

  // বক্স খালি করা
  box.innerHTML = "";
};

</script>

</body>
</html>
