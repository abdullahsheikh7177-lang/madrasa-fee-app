<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>নতুন নোটিশ</title>
</head>
<body>

<h2>📢 নতুন নোটিশ</h2>

<p>প্রতিটি লাইন আলাদা বক্সে লিখুন:</p>

<div id="inputContainer">
  <input type="text" class="lineInput" placeholder="লাইন ১" style="width:80%; margin:5px 0;">
</div>

<button id="addLineBtn">➕ আরও লাইন যোগ করুন</button>
<br><br>
<button id="submitNotice">✅ Submit</button>

<hr>

<div id="noticeList"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {
  initializeFirestore,
  persistentLocalCache,
  persistentSingleTabManager,
  collection,
  addDoc,
  getDocs,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDhdamD0ApIaUeW0km2uSA7ksmGJO8f5Po",
  authDomain: "madrasa-fee-app.firebaseapp.com",
  projectId: "madrasa-fee-app",
  storageBucket: "madrasa-fee-app.firebasestorage.app",
  messagingSenderId: "1011327270340",
  appId: "1:1011327270340:web:b51a08befa3aafce4a7891",
  measurementId: "G-ZT4457XDKS"
};

const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app, {
  localCache: persistentLocalCache({
    tabManager: persistentSingleTabManager()
  })
});

let notices = [];

// লোকাল ক্যাশ থেকে লোড
async function loadNotice() {
  const cache = localStorage.getItem("notice2");
  if (cache) {
    notices = JSON.parse(cache);
    showNotice();
  }
  if (navigator.onLine) {
    const q = query(collection(db, "notice"), orderBy("createdAt", "desc"));
    const snapshot = await getDocs(q);
    notices = [];
    snapshot.forEach((doc) => {
      notices.push({ id: doc.id, ...doc.data() });
    });
    localStorage.setItem("notice2", JSON.stringify(notices));
    showNotice();
  }
}

function showNotice() {
  let html = "";
  notices.forEach(function(item) {
    let text = item.text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    let lines = text.split('\n');
    let formattedText = lines.join('<br>');
    html += `
<div style="border:1px solid #999; padding:10px; margin:10px; border-radius:8px;">
📢 ${formattedText}
</div>
`;
  });
  document.getElementById("noticeList").innerHTML = html;
}

loadNotice();

// নতুন লাইন যোগ
document.getElementById("addLineBtn").onclick = function() {
  let container = document.getElementById("inputContainer");
  let newInput = document.createElement("input");
  newInput.type = "text";
  newInput.className = "lineInput";
  newInput.placeholder = "লাইন " + (container.children.length + 1);
  newInput.style.width = "80%";
  newInput.style.margin = "5px 0";
  container.appendChild(newInput);
};

// Submit
document.getElementById("submitNotice").onclick = async function() {
  let inputs = document.querySelectorAll(".lineInput");
  let lines = [];
  inputs.forEach(function(inp) {
    let val = inp.value.trim();
    if (val !== "") lines.push(val);
  });

  if (lines.length === 0) {
    alert("কমপক্ষে একটি লাইন লিখুন");
    return;
  }

  let text = lines.join("\n");

  // ডিবাগ
  console.log(text);
  console.log(JSON.stringify(text));
  alert("✅ টেক্সট:\n" + JSON.stringify(text));

  const newNotice = {
    id: "local_" + Date.now(),
    text: text,
    createdAt: Date.now()
  };

  notices.unshift(newNotice);
  localStorage.setItem("notice2", JSON.stringify(notices));
  showNotice();

  try {
    await addDoc(collection(db, "notice"), {
      text: text,
      createdAt: Date.now()
    });
    await loadNotice();
  } catch(e) {
    console.log("Offline Mode");
  }

  // ফিল্ড খালি
  inputs.forEach(inp => inp.value = "");
  document.getElementById("inputContainer").innerHTML = `
    <input type="text" class="lineInput" placeholder="লাইন ১" style="width:80%; margin:5px 0;">
  `;
};
</script>

</body>
</html>
